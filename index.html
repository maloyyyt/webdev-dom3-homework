<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Проект "Комменты"</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <ul class="comments"></ul>

    <div class="add-form">
      <input
        type="text"
        class="add-form-name"
        placeholder="Введите ваше имя"
      />

      <textarea
        class="add-form-text"
        placeholder="Введите ваш комментарий"
        rows="4"
      ></textarea>

      <div class="add-form-row">
        <button class="add-form-button">
          Написать
        </button>
      </div>
    </div>
  </div>

  <script>
    let comments = [
      {
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text:
          "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false,
      },

      {
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text:
          "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: true,
      },
    ];

    const nameInput =
      document.querySelector(".add-form-name");

    const textInput =
      document.querySelector(".add-form-text");

    const addButton =
      document.querySelector(".add-form-button");

    const commentsList =
      document.querySelector(".comments");

    // Защита от HTML
    function escapeHtml(str) {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    // Получение даты
    function getCurrentDateTime() {
      const now = new Date();

      const day = String(
        now.getDate()
      ).padStart(2, "0");

      const month = String(
        now.getMonth() + 1
      ).padStart(2, "0");

      const year = String(
        now.getFullYear()
      ).slice(2);

      const hours = String(
        now.getHours()
      ).padStart(2, "0");

      const minutes = String(
        now.getMinutes()
      ).padStart(2, "0");

      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    // Лайк
    function handleLikeClick(event) {
      event.stopPropagation();

      const button = event.currentTarget;

      const commentIndex = parseInt(
        button.getAttribute("data-like-button")
      );

      if (comments[commentIndex].isLiked) {
        comments[commentIndex].isLiked = false;
        comments[commentIndex].likes -= 1;
      } else {
        comments[commentIndex].isLiked = true;
        comments[commentIndex].likes += 1;
      }

      renderComments();
    }

    // Ответ на комментарий
    function handleCommentClick(event) {
      const commentElement =
        event.currentTarget;

      const commentIndex = parseInt(
        commentElement.getAttribute(
          "data-comment-index"
        )
      );

      const comment = comments[commentIndex];

      if (comment) {
        // поле имени пустое
        nameInput.value = "";

        // имя автора вставляется в комментарий
        textInput.value =
          `> ${comment.name}: ${comment.text}\n\n`;

        textInput.focus();

        // анимация
        commentElement.style.transform =
          "scale(0.99)";

        setTimeout(() => {
          commentElement.style.transform =
            "";
        }, 150);
      }
    }

    // Проверка формы
    function validateForm() {
      const name =
        nameInput.value.trim();

      const text =
        textInput.value.trim();

      if (name === "") {
        alert(
          "Пожалуйста, введите ваше имя"
        );

        nameInput.focus();

        return false;
      }

      if (text === "") {
        alert(
          "Пожалуйста, введите текст комментария"
        );

        textInput.focus();

        return false;
      }

      return true;
    }

    // Форматирование текста
    function formatCommentText(text) {
      const safeText =
        escapeHtml(text);

      return safeText
        .replaceAll("\n", "<br>")
        .replaceAll("&gt;", ">");
    }

    // Добавление комментария
    function addComment() {
      if (!validateForm()) {
        return;
      }

      const newComment = {
        name: escapeHtml(
          nameInput.value.trim()
        ),

        date: getCurrentDateTime(),

        text: textInput.value.trim(),

        likes: 0,

        isLiked: false,
      };

      comments.push(newComment);

      nameInput.value = "";

      textInput.value = "";

      renderComments();

      setTimeout(() => {
        const newCommentElement =
          document.querySelector(
            ".comment:last-child"
          );

        if (newCommentElement) {
          newCommentElement.scrollIntoView(
            {
              behavior: "smooth",
              block: "start",
            }
          );
        }
      }, 100);
    }

    // Рендер
    function renderComments() {
      let commentsHTML = "";

      for (
        let i = 0;
        i < comments.length;
        i++
      ) {
        const comment = comments[i];

        const likeButtonClass =
          comment.isLiked
            ? "like-button -active-like"
            : "like-button";

        commentsHTML += `
          <li
            class="comment"
            data-comment-index="${i}"
          >
            
            <div class="comment-header">
              <div>${comment.name}</div>

              <div>${comment.date}</div>
            </div>

            <div class="comment-body">
              <div class="comment-text">
                ${formatCommentText(
                  comment.text
                )}
              </div>
            </div>

            <div class="comment-footer">
              <div class="likes">

                <span class="likes-counter">
                  ${comment.likes}
                </span>

                <button
                  class="${likeButtonClass}"
                  data-like-button="${i}"
                ></button>

              </div>
            </div>

          </li>
        `;
      }

      commentsList.innerHTML =
        commentsHTML;

      // Лайки
      const likeButtons =
        document.querySelectorAll(
          "[data-like-button]"
        );

      for (const button of likeButtons) {
        button.addEventListener(
          "click",
          handleLikeClick
        );
      }

      // Ответы
      const commentElements =
        document.querySelectorAll(
          ".comment"
        );

      for (const element of commentElements) {
        element.addEventListener(
          "click",
          handleCommentClick
        );
      }
    }

    // Добавление комментария
    addButton.addEventListener(
      "click",
      addComment
    );

    // Ctrl + Enter
    textInput.addEventListener(
      "keydown",
      (event) => {
        if (
          (event.ctrlKey ||
            event.metaKey) &&
          event.key === "Enter"
        ) {
          addComment();
        }
      }
    );

    renderComments();
  </script>
</body>
</html>
